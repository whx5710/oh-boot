services:
  oh-server:
    image: oh-boot:1.0.0
    container_name: oh-server
    restart: unless-stopped
    # 生产环境建议只暴露 nginx 的 80/443，后端端口仅限本机/内网调试
    ports:
      - "127.0.0.1:5710:5710"
    environment:
      - spring.profiles.active=prod
      - JAVA_OPTS=-Xms2048M -Xmx2048M
      - LICENSE_MACHINE_CODE=${LICENSE_MACHINE_CODE}
    volumes:
      - /home/finn/data/oh-server.jar:/app/oh-server.jar
    networks:
      - oh-network

  finn-redis:
    image: redis:7-alpine
    container_name: finn-redis
    restart: unless-stopped
    # 不暴露公网端口，仅内部网络访问
    volumes:
      - /home/finn/data/redis:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - oh-network

  finn-postgres:
    image: postgres:18-alpine
    container_name: finn-postgres
    restart: unless-stopped
    # 不暴露公网端口，仅内部网络访问
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /home/finn/data/postgres:/var/lib/postgresql
    networks:
      - oh-network

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    ports:
      - "127.0.0.1:9333:9333"   # Master UI
      - "127.0.0.1:8080:8080"   # Volume
      - "127.0.0.1:8888:8888"   # Filer UI
      - "127.0.0.1:8333:8333"   # S3 API
    volumes:
      - /home/finn/data/seaweedfs:/data
      - ./s3-config.json:/etc/seaweedfs/s3.json:ro
    command: >
      server -s3 -s3.config=/etc/seaweedfs/s3.json
      -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024
    restart: unless-stopped
    networks:
      - oh-network

  nginx:
    image: nginx:alpine
    container_name: oh-nginx
    restart: unless-stopped
    ports:
#      - "8081:8081"
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - oh-server
    networks:
      - oh-network

networks:
  oh-network:
    driver: bridge