user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 上传文件大小限制，按需调整（与后端保持一致）
    client_max_body_size 50M;

    # ============================================================
    # 当前为 HTTP 模式（无 SSL），适合没有证书时临时跑起来。
    # 正式上线/微信小程序必须使用 HTTPS，请按 README 替换为 SSL 配置。
    # ============================================================
    server {
        listen 8443;
        server_name www.cwalker.top;

        # 所有 /api/ 开头的请求反向代理到后端，并去掉 /api 前缀
        # 例如：/api/sys/openUser/update -> 后端 /sys/openUser/update
        location /api/ {
            proxy_pass http://oh-server:5710/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 健康检查（可选）
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ============================================================
    # HTTPS 配置参考（有 SSL 证书后，取消注释上方 server 并注释掉上方 HTTP server）
